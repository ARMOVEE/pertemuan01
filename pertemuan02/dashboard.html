<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sidenav</title>
  
  <!-- CSS Styles untuk Sidenav dan Main Content -->
  <style>
    :root {
      --bg-color: #f4f7f6;
      --sidebar-bg: #1e1e24;
      --sidebar-hover: #2d2d35;
      --text-color: #b6b6b6;
      --text-hover: #ffffff;
      --transition-speed: 0.3s;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      display: flex;
    }

    /* Flexbox utilities bawaan dari kode Anda */
    .flexbox {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .flexbox-col {
      display: flex;
      flex-direction: column;
    }

    .flexbox-left {
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    /* Navbar / Sidenav Styles */
    #navbar {
      width: 5rem;
      height: 100vh;
      position: fixed;
      background-color: var(--sidebar-bg);
      transition: width var(--transition-speed) ease;
      overflow: hidden;
      z-index: 1000;
    }

    #navbar:hover {
      width: 16rem;
    }

    .navbar-items {
      list-style: none;
      padding: 0;
      margin: 0;
      height: 100%;
    }

    .navbar-logo {
      width: 100%;
      height: 5rem;
      background-color: #141418;
      margin-bottom: 1rem;
    }

    .navbar-logo svg {
      width: 2.5rem;
      min-width: 2.5rem;
      fill: var(--text-hover);
      margin-left: 1.25rem;
      transition: transform var(--transition-speed);
    }

    #navbar:hover .navbar-logo svg {
      transform: rotate(180deg);
    }

    .navbar-item {
      width: 100%;
    }

    /* Memisahkan 'Settings' agar ada di bawah (opsional) */
    .navbar-item:last-child {
      margin-top: auto;
      margin-bottom: 1rem;
    }

    .navbar-item-inner {
      width: 100%;
      height: 4rem;
      color: var(--text-color);
      text-decoration: none;
      transition: background-color var(--transition-speed), color var(--transition-speed);
      cursor: pointer;
    }

    .navbar-item-inner:hover,
    .navbar-item-inner.active {
      background-color: var(--sidebar-hover);
      color: var(--text-hover);
    }

    .navbar-item-inner-icon-wrapper {
      width: 5rem;
      min-width: 5rem;
    }

    .navbar-item-inner-icon-wrapper ion-icon {
      font-size: 1.5rem;
    }

    .link-text {
      display: none;
      font-weight: 500;
      white-space: nowrap;
    }

    #navbar:hover .link-text {
      display: block;
    }

    /* Main Content Styles */
    #main {
      margin-left: 5rem;
      padding: 3rem;
      width: 100%;
      transition: margin-left var(--transition-speed) ease;
      color: #333;
    }

    #main h2 {
      font-size: 2.5rem;
      margin-top: 0;
      color: #1e1e24;
    }

    #main p {
      line-height: 1.6;
      font-size: 1.1rem;
      max-width: 800px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav id="navbar">
    <ul class="navbar-items flexbox-col">
      <li class="navbar-logo flexbox-left">
        <a class="navbar-item-inner flexbox">
          <svg xmlns="http://www.w3.org/2000/svg" id="Layer_1" data-name="Layer 1" viewBox="0 0 1438.88 1819.54">
            <polygon points="925.79 318.48 830.56 0 183.51 1384.12 510.41 1178.46 925.79 318.48"/>
            <polygon points="1438.88 1663.28 1126.35 948.08 111.98 1586.26 0 1819.54 1020.91 1250.57 1123.78 1471.02 783.64 1663.28 1438.88 1663.28"/>
          </svg>
        </a>
      </li>
      <li class="navbar-item flexbox-left">
        <a class="navbar-item-inner flexbox-left">
          <div class="navbar-item-inner-icon-wrapper flexbox">
            <ion-icon name="search-outline"></ion-icon>
          </div>
          <span class="link-text">Search</span>
        </a>
      </li>
      <li class="navbar-item flexbox-left">
        <a href="home.html" class="navbar-item-inner flexbox-left">
          <div class="navbar-item-inner-icon-wrapper flexbox">
            <ion-icon name="home-outline"></ion-icon>
          </div>
          <span class="link-text">Home</span>
        </a>
      </li>
      <li class="navbar-item flexbox-left">
        <a class="navbar-item-inner flexbox-left">
          <div class="navbar-item-inner-icon-wrapper flexbox">
            <ion-icon name="folder-open-outline"></ion-icon>
          </div>
          <span class="link-text">Projects</span>
        </a>
      </li>
      <li class="navbar-item flexbox-left">
        <a href="dashboard.html" class="navbar-item-inner flexbox-left active">
          <div class="navbar-item-inner-icon-wrapper flexbox">
            <ion-icon name="pie-chart-outline"></ion-icon>
          </div>
          <span class="link-text">Dashboard</span>
        </a>
      </li>
      <li class="navbar-item flexbox-left">
        <a class="navbar-item-inner flexbox-left">
          <div class="navbar-item-inner-icon-wrapper flexbox">
            <ion-icon name="people-outline"></ion-icon>
          </div>
          <span class="link-text">Team</span>
        </a>
      </li>
      <li class="navbar-item flexbox-left">
        <a class="navbar-item-inner flexbox-left">
          <div class="navbar-item-inner-icon-wrapper flexbox">
            <ion-icon name="chatbubbles-outline"></ion-icon>
          </div>
          <span class="link-text">Support</span>
        </a>
      </li>
      <li class="navbar-item flexbox-left">
        <a href="index.html" class="navbar-item-inner flexbox-left">
          <div class="navbar-item-inner-icon-wrapper flexbox">
            <ion-icon name="log-out-outline"></ion-icon>
          </div>
          <span class="link-text">Logout</span>
        </a>
      </li>
      <li class="navbar-item flexbox-left">
        <a class="navbar-item-inner flexbox-left">
          <div class="navbar-item-inner-icon-wrapper flexbox">
            <ion-icon name="settings-outline"></ion-icon>
          </div>
          <span class="link-text">Settings</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Main -->
  <main id="main" class="flexbox-col">
    <h2>HALAMAN DASHBOARD</h2>
    <p>Ini adalah tampilan dashboard. Struktur Sidenav-nya persis sama dengan home.html, namun isi konten di tengah bisa Anda ubah di sini.</p>
  </main>

  <!-- Script untuk memanggil ikon dari Ionicons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>
